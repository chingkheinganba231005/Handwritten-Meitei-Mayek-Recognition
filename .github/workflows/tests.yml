name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install timm numpy pandas opencv-python-headless scikit-image scikit-learn pillow pytest onnx onnxruntime onnxscript
      - run: pytest -q
